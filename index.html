<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>License Plate Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a license plate scoreboard over one big tappable road-atlas map, with the to-find list below. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2430; --muted:#5f6b7a; --line:#cdd4dc;
  --land:#f8fafb; --border:#3b4654; --plate:#fbfcfd; --plate-ink:#123a7a; --plate-rim:#123a7a;
  --r:#d64541; --b:#2f6fdb; --g:#2e9e5b; --y:#f2c12e; --o:#ee7d2b;
  --ink-on-dark:#ffffff; --ink-on-light:#1b2430;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171e; --surface:#1a212b; --ink:#e8edf2; --muted:#98a4b3; --line:#2c3644;
  --land:#222b37; --border:#8d9aab; --plate:#1f2834; --plate-ink:#9cc0ff; --plate-rim:#5d8fe0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1a212b; --ink:#e8edf2; --muted:#98a4b3; --line:#2c3644;
  --land:#222b37; --border:#8d9aab; --plate:#1f2834; --plate-ink:#9cc0ff; --plate-rim:#5d8fe0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
.plate{position:relative;background:var(--plate);border:3px solid var(--plate-rim);border-radius:12px;
  padding:6px 22px 8px;min-width:168px;text-align:center;box-shadow:0 1px 0 var(--line)}
.plate::before,.plate::after{content:"";position:absolute;top:9px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.plate::before{left:9px}.plate::after{right:9px}
.plate small{display:block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.22em;color:var(--plate-ink);text-transform:uppercase}
.plate b{display:block;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--plate-ink);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--r),var(--o),var(--y),var(--g),var(--b));transition:width .4s ease}
.status{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.status strong{color:var(--ink);font-weight:600}
.mapcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
svg.drag{cursor:grabbing}
.st path{fill:var(--land);stroke:var(--border);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .2s}
.st text{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.04em;text-anchor:middle;dominant-baseline:central;fill:var(--muted);pointer-events:none}
.st text.sm{font-size:10px}
.st .lead{stroke:var(--muted);stroke-width:.8;vector-effect:non-scaling-stroke}
.st .tag{fill:var(--land);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
.st{cursor:pointer;outline:none}
.st:focus-visible path,.st:focus-visible .tag{stroke:var(--ink);stroke-width:2.5}
.st.on.r path,.st.on.r .tag{fill:var(--r)} .st.on.b path,.st.on.b .tag{fill:var(--b)}
.st.on.g path,.st.on.g .tag{fill:var(--g)} .st.on.y path,.st.on.y .tag{fill:var(--y)} .st.on.o path,.st.on.o .tag{fill:var(--o)}
.st.on.r text,.st.on.b text,.st.on.g text{fill:var(--ink-on-dark)}
.st.on.y text,.st.on.o text{fill:var(--ink-on-light)}
.st.on .lead~text{fill:var(--ink-on-dark)} .st.on.y .lead~text,.st.on.o .lead~text{fill:var(--ink-on-light)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.zoom button{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:20px;font-weight:500;cursor:pointer;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--bg)}
.zoom button:focus-visible{outline:2px solid var(--b);outline-offset:-2px}
.zoom svg{width:18px;height:18px;cursor:inherit}
.hint{font-size:13px;color:var(--muted);margin-top:-8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--body);padding:6px 10px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.done{color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.warn{border-color:var(--r);color:var(--r)}
.btn:focus-visible{outline:2px solid var(--b);outline-offset:1px}
@media (max-width:520px){h1{font-size:28px}.plate b{font-size:34px}.plate{min-width:140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Road trip edition</div>
      <h1>50-State License Plate Game</h1>
    </div>
    <div class="plate" aria-live="polite"><small>States found</small><b id="count">0/50</b></div>
  </header>

  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <div class="status"><span id="last">Tap a state when you spot its plate.</span><span><strong id="left">50</strong> to go</span></div>

  <div class="mapcard">

<g class="st b" data-s="WY" tabindex="0" role="button" aria-label="Wyoming"><title>Wyoming</title><path d="M288.3,150.9L341.9,157.4L373.5,160.6L369.5,208.8L365.3,257.2L335.1,254.5L295.8,249.9L275.5,247.4L239.8,242.0L243.6,217.9L253.1,158.5L255.0,145.9L288.3,150.9Z"/><text x="308" y="203">WY</text></g>
    </svg>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="zfit" aria-label="Show whole map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="hint">Pinch or use the + and − buttons to zoom in on small states. Drag to move around.</div>

  <section class="panel">
    <div class="panel-head">
      <h2>Still to find</h2>
      <div class="tools">
        <button class="btn" id="undo" disabled>Undo last</button>
        <button class="btn" id="reset">Reset game</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </section>
</div>

<script>
const NAMES={"AK": "Alaska", "AL": "Alabama", "AR": "Arkansas", "AZ": "Arizona", "CA": "California", "CO": "Colorado", "CT": "Connecticut", "DE": "Delaware", "FL": "Florida", "GA": "Georgia", "HI": "Hawaii", "IA": "Iowa", "ID": "Idaho", "IL": "Illinois", "IN": "Indiana", "KS": "Kansas", "KY": "Kentucky", "LA": "Louisiana", "MA": "Massachusetts", "MD": "Maryland", "ME": "Maine", "MI": "Michigan", "MN": "Minnesota", "MO": "Missouri", "MS": "Mississippi", "MT": "Montana", "NC": "North Carolina", "ND": "North Dakota", "NE": "Nebraska", "NH": "New Hampshire", "NJ": "New Jersey", "NM": "New Mexico", "NV": "Nevada", "NY": "New York", "OH": "Ohio", "OK": "Oklahoma", "OR": "Oregon", "PA": "Pennsylvania", "RI": "Rhode Island", "SC": "South Carolina", "SD": "South Dakota", "TN": "Tennessee", "TX": "Texas", "UT": "Utah", "VA": "Virginia", "VT": "Vermont", "WA": "Washington", "WI": "Wisconsin", "WV": "West Virginia", "WY": "Wyoming"}, GROUP={"AZ": "r", "ID": "r", "MA": "r", "MD": "r", "MO": "r", "MS": "r", "ND": "r", "NJ": "r", "OH": "r", "SC": "r", "CT": "b", "IA": "b", "IN": "b", "LA": "b", "ME": "b", "OK": "b", "OR": "b", "TN": "b", "WV": "b", "WY": "b", "CO": "g", "GA": "g", "MI": "g", "MN": "g", "NV": "g", "PA": "g", "TX": "g", "VA": "g", "VT": "g", "WA": "g", "AK": "y", "AL": "y", "DE": "y", "KY": "y", "MT": "y", "NE": "y", "NY": "y", "RI": "y", "UT": "y", "WI": "y", "AR": "o", "CA": "o", "FL": "o", "HI": "o", "IL": "o", "KS": "o", "NC": "o", "NH": "o", "NM": "o", "SD": "o"}, KEY='lpgame50';
let found={}, history=[];
try{found=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){found={}}
const $=id=>document.getElementById(id);
const svg=$('map'), states=[...document.querySelectorAll('.st')];
const byS={}; states.forEach(g=>byS[g.dataset.s]=g);

function save(){try{localStorage.setItem(KEY,JSON.stringify(found))}catch(e){}}
function render(){
  const n=Object.keys(found).length;
  states.forEach(g=>g.classList.toggle('on',!!found[g.dataset.s]));
  $('count').textContent=n+'/50';
  $('left').textContent=50-n;
  $('fill').style.width=(n*2)+'%';
  const rest=Object.keys(NAMES).filter(s=>!found[s]).sort((a,b)=>NAMES[a].localeCompare(NAMES[b]));
  $('chips').innerHTML=rest.length?rest.map(s=>`<button class="chip" data-s="${s}" style="--c:var(--${GROUP[s]})">${NAMES[s]}</button>`).join(''):'<span class="done">All 50 found. Nice driving.</span>';
  $('undo').disabled=!history.length;
}
function toggle(s){
  const on=!found[s];
  if(on)found[s]=1;else delete found[s];
  history.push([s,on]);save();render();
  const n=Object.keys(found).length;
  $('last').textContent=on?(n===50?`${NAMES[s]}! That's all 50.`:`Found ${NAMES[s]}.`):`Unmarked ${NAMES[s]}.`;
}
$('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)toggle(c.dataset.s)});
$('undo').onclick=()=>{const h=history.pop();if(!h)return;const[s,on]=h;if(on)delete found[s];else found[s]=1;save();render();$('last').textContent=`Undid ${NAMES[s]}.`};
let armed=null;
$('reset').onclick=()=>{
  const b=$('reset');
  if(!armed){b.textContent='Tap again to clear all';b.classList.add('warn');armed=setTimeout(()=>{armed=null;b.textContent='Reset game';b.classList.remove('warn')},3000);return}
  clearTimeout(armed);armed=null;b.textContent='Reset game';b.classList.remove('warn');
  found={};history=[];save();render();$('last').textContent='Game reset. Tap a state when you spot its plate.';
};
states.forEach(g=>g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(g.dataset.s)}}));

/* Zoom and pan by moving the viewBox */
const BASE={x:0,y:0,w:1050,h:680}; let vb={...BASE};
const MAXZ=8;
function apply(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function clamp(){
  vb.w=Math.min(BASE.w,Math.max(BASE.w/MAXZ,vb.w)); vb.h=vb.w*BASE.h/BASE.w;
  vb.x=Math.min(BASE.w-vb.w,Math.max(0,vb.x)); vb.y=Math.min(BASE.h-vb.h,Math.max(0,vb.y));
}
function zoomAt(f,cx,cy){ // f>1 zooms in; cx,cy in svg units
  const nw=vb.w/f; const k=nw/vb.w;
  vb.x=cx-(cx-vb.x)*k; vb.y=cy-(cy-vb.y)*k; vb.w=nw; clamp(); apply();
}
function toSvg(px,py){const r=svg.getBoundingClientRect();return[vb.x+(px-r.left)/r.width*vb.w, vb.y+(py-r.top)/r.height*vb.h]}
function center(){return[vb.x+vb.w/2,vb.y+vb.h/2]}
$('zin').onclick=()=>zoomAt(1.6,...center());
$('zout').onclick=()=>zoomAt(1/1.6,...center());
$('zfit').onclick=()=>{vb={...BASE};apply()};
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0025),...toSvg(e.clientX,e.clientY))},{passive:false});

const ptrs=new Map(); let moved=false, pinched=false, downState=null, last=null, pinch0=null;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  if(ptrs.size===1){moved=false;pinched=false;const g=e.target.closest('.st');downState=g?g.dataset.s:null}
  if(ptrs.size===2){pinched=true;const[a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w}}
});
svg.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p)return;
  const r=svg.getBoundingClientRect(), s=vb.w/r.width;
  if(ptrs.size===1){
    if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>6){moved=true;svg.classList.add('drag')}
    if(moved){vb.x-=(e.clientX-p.x)*s;vb.y-=(e.clientY-p.y)*s;clamp();apply()}
    p.x=e.clientX;p.y=e.clientY;
  }else if(ptrs.size===2){
    const[a0,b0]=[...ptrs.values()]; const midOld=[(a0.x+b0.x)/2,(a0.y+b0.y)/2];
    p.x=e.clientX;p.y=e.clientY;
    const[a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mid=[(a.x+b.x)/2,(a.y+b.y)/2];
    vb.x-=(mid[0]-midOld[0])*s; vb.y-=(mid[1]-midOld[1])*s; clamp();
    const target=pinch0.w*pinch0.d/Math.max(d,1);
    zoomAt(vb.w/target,...toSvg(mid[0],mid[1]));
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    svg.classList.remove('drag');
    if(!moved&&!pinched&&downState&&e.type==='pointerup')toggle(downState);
    downState=null;
  }
}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);

render();
</script>
